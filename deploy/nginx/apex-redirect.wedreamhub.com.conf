# 根域 wedreamhub.com（不带前缀）→ 301 跳转到 www.wedreamhub.com（主站规范域名）。
#
# 【为什么需要独立 server】通配 `*.wedreamhub.com` 不匹配 apex 裸域，apex 会落到宝塔默认站/default_server。
# 本文件给 apex 一个精确 server_name（优先于通配），把根域永久重定向到 www 主站，
# 统一主站规范域名，避免 apex 直接命中后端渲染主站（与「www=主站」模型一致）。
#
# 【证书前置】通配证书 `*.wedreamhub.com` 不覆盖裸 apex（wildcard 不匹配 apex）。443 块需要证书 SAN 含
# `wedreamhub.com`。现网 CF Origin CA 证书通常同时签发 `wedreamhub.com` + `*.wedreamhub.com`——
# 若当前证书 SAN 未含 apex，重签一张含 apex 的 CF Origin CA，或改由 Cloudflare 侧「重定向规则」做 apex→www。
#
# 【CF 说明】apex 与 www 一样经 Cloudflare 代理（80 Flexible / 443 Full）。若在 CF 侧已配 apex→www 的
# 重定向规则，则本 nginx 块可省略；二选一，避免双重跳转。
#
# 部署：放 /www/server/panel/vhost/nginx/apex-redirect.wedreamhub.com.conf；
#       证书复用 /www/server/panel/vhost/cert/wildcard.wedreamhub.com/（SAN 须含 apex）；
#       `nginx -t && nginx -s reload`。
server {
    listen 80;
    listen 443 ssl;
    server_name wedreamhub.com;

    ssl_certificate     /www/server/panel/vhost/cert/wildcard.wedreamhub.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/wildcard.wedreamhub.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://www.wedreamhub.com$request_uri;
}
