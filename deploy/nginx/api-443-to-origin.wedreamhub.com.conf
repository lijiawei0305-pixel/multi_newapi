# api.wedreamhub.com:443 → fork 栈 newapi_test (127.0.0.1:3100)。
# 【历史】原文件把 api:443 指向已删除的 stock 栈 newapi_YFNf(:3000)；2026-07-03 单栈收敛后
#   api 亦并入 fork(:3100)，本仓库副本已同步为 3100。原 :3000 版在服务器存为
#   .bak-before-consolidate（见 CLAUDE.md「服务器现状」）。
# 【为什么需要它】宝塔的 api vhost 只 listen 80；有了 *.wedreamhub.com 通配 443 vhost 后，
#   若无精确 api:443 server，CF(Full=经 443 回源)对 api 的 HTTPS 会落到通配。本文件提供 api 的
#   精确 443 server（精确 server_name 优先于通配），确保 api HTTPS 稳定进 fork 3100。
#   注：功能上与通配等价（api 亦是 fork 域，按 Host 解析租户）——若线上已改由通配兜底 api，
#   本文件可删；两条路径都到 3100。
# 证书复用通配 CF Origin CA（SAN 含 api.wedreamhub.com）。fork 按 Host 解析租户，故 Host $host（非旧的 127.0.0.1）。
# 部署：放 /www/server/panel/vhost/nginx/ 下；`nginx -t && nginx -s reload`。
# ⚠ 本副本按 fork 行为重建（镜像 wildcard.conf）；下发前请与服务器现有 api vhost `diff` 核对一致。
server {
    listen 443 ssl;
    server_name api.wedreamhub.com;
    client_max_body_size 200m;  # 同通配：避免大 LLM 请求体 413（默认 http 级 50m）
    ssl_certificate     /www/server/panel/vhost/cert/wildcard.wedreamhub.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/wildcard.wedreamhub.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 内网入账端点：禁止公网访问（仅 compose 内 auth-service→app 调用）。
    location ^~ /api/internal/ { return 404; }

    # 支付网关 auth-service（微信/支付宝下单 + mock 支付页 + 回调）。
    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
