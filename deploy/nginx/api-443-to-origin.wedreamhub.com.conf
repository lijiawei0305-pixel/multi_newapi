# api.wedreamhub.com:443 → 现网 newapi_YFNf (127.0.0.1:3000)。
# 【为什么需要它】宝塔的 api vhost 只 `listen 80`；加了 `*.wedreamhub.com` 通配 443 vhost 后，
# CF(Full=经 443 回源)对 api.wedreamhub.com 的 HTTPS 会因无精确 443 匹配而落到通配 → 误转到我们的新栈 3100。
# 本文件提供 api 的精确 443 server（精确 server_name 优先于通配），把 api HTTPS 拉回现网 3000，互不串扰。
# 证书复用通配 CF Origin CA（SAN 含 api.wedreamhub.com）。镜像宝塔 api 反代：proxy_set_header Host 127.0.0.1。
# 部署：放 /www/server/panel/vhost/nginx/ 下；`nginx -t && nginx -s reload`。勿改宝塔原 api vhost（80）。
server {
    listen 443 ssl;
    server_name api.wedreamhub.com;
    ssl_certificate     /www/server/panel/vhost/cert/wildcard.wedreamhub.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/wildcard.wedreamhub.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }
}
