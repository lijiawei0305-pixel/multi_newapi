# *.wedreamhub.com → newapi_test 栈 (127.0.0.1:3100) —— 多租户通配上线 vhost。
# 任意代理子域均进后端按 Host 解析租户（已知租户→品牌，未知→TENANT_NOT_FOUND 站点未开通）。
# CF 代理：80(Flexible) + 443(当前自签通配；换 CF Origin CA 证书后可切 Full strict)。
# nginx server_name 精确匹配优先：现网 api.wedreamhub.com（→3000 newapi_YFNf）不受影响，本通配只兜底其余子域。
# 部署：放 /www/server/panel/vhost/nginx/wildcard.wedreamhub.com.conf；证书放 /www/server/panel/vhost/cert/wildcard.wedreamhub.com/{fullchain,privkey}.pem；
#       tokendream.wedreamhub.com.conf 已改 .bak 让通配接管。`nginx -t && nginx -s reload`。
server {
    listen 80;
    listen 443 ssl;
    server_name *.wedreamhub.com;

    ssl_certificate     /www/server/panel/vhost/cert/wildcard.wedreamhub.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/wildcard.wedreamhub.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 内网入账端点：禁止公网访问（仅 compose 内 auth-service→app 调用）。
    location ^~ /api/internal/ { return 404; }

    # 支付网关 auth-service（微信/支付宝下单 + mock 支付页 + 回调）。
    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
