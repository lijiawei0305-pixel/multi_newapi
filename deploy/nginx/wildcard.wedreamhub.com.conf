# *.wedreamhub.com → newapi_test 栈 (127.0.0.1:3100) —— 多租户通配上线 vhost。
# 任意代理子域均进后端按 Host 解析租户（已知租户→品牌，未知→TENANT_NOT_FOUND 站点未开通）。
# CF 代理：80 只做 308 HTTPS 跳转；443 用 CF Origin CA（Full strict）。
# nginx server_name 精确匹配优先：api.wedreamhub.com 若存在精确 vhost 则优先命中它，否则由本通配兜底
#   （2026-07-03 单栈收敛后 api 亦已改指 3100 fork；原 :3000 newapi_YFNf 已删除）。本通配兜底其余子域。
# 部署：放 /www/server/panel/vhost/nginx/wildcard.wedreamhub.com.conf；证书放 /www/server/panel/vhost/cert/wildcard.wedreamhub.com/{fullchain,privkey}.pem；
#       tokendream.wedreamhub.com.conf 已改 .bak 让通配接管。`nginx -t && nginx -s reload`。
server {
    listen 80;
    server_name *.wedreamhub.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name *.wedreamhub.com;

    # LLM/Codex 请求体可能很大（大代码上下文/文件），默认 http 级 50m 会让 /v1/responses 等 413。
    client_max_body_size 200m;

    ssl_certificate     /www/server/panel/vhost/cert/wildcard.wedreamhub.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/wildcard.wedreamhub.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 内网管理端点禁止公网访问。
    location ^~ /api/internal/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
