# tokendream.wedreamhub.com → newapi_test 测试栈 (127.0.0.1:3100)
# Cloudflare 代理：同时监听 80(Flexible) 与 443(Full，自签证书，CF Full 不校验源站证书)。
# 独立 server 块，按 server_name 精确匹配，不影响现网 api.wedreamhub.com。
server {
    listen 80;
    listen 443 ssl;
    server_name tokendream.wedreamhub.com;

    ssl_certificate     /www/server/panel/vhost/cert/tokendream.wedreamhub.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/tokendream.wedreamhub.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 内网入账端点：仅 auth-service 经 compose 内部网调用，绝不暴露公网。
    # ^~ 优先级高于 location /，命中即拒（404，不泄露存在性）。
    location ^~ /api/internal/ {
        return 404;
    }

    # 支付网关：反代到 auth-service（127.0.0.1:8180）。承载支付平台异步回调
    # （/auth/wxpay/notify、/auth/alipay/notify）与 mock 确认页（/auth/mock/pay）。
    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
