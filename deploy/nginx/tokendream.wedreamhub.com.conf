# tokendream.wedreamhub.com → 唯一现网 newapi_test 栈 (127.0.0.1:3100)
# Cloudflare 代理：80 只做 308 HTTPS 跳转；443 使用可验证源站证书。
# 独立 server 块，按 server_name 精确匹配；api 与本域名都反代到同一生产 app。
server {
    listen 80;
    server_name tokendream.wedreamhub.com;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tokendream.wedreamhub.com;

    ssl_certificate     /www/server/panel/vhost/cert/tokendream.wedreamhub.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/tokendream.wedreamhub.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 防御：拒绝公网访问任何 /api/internal/*（保留为安全默认；当前已无内网入账端点）。
    location ^~ /api/internal/ {
        return 404;
    }

    # 微信/支付宝异步回调由主站进程内处理：
    # /api/pay/{wechat,alipay}/notify 经下方 location / 反代到 app(3100)。

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
