# 集成自测编排（Phase 2 · new-api fork）。部署时用项目名隔离：
#   docker compose -p newapi_test -f deploy/docker-compose.test.yml up -d --build
# 不写 container_name / 外部网络：靠 -p 前缀隔离，默认网络自动创建。
# app 直接构建仓库根的 new-api Dockerfile（多阶段：bun 构建 web/default+classic → go build 内嵌）。
services:
  app:
    build:
      context: ..            # 上下文为仓库根（new-api Dockerfile 在根）
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3100:3000" # 仅本机回环暴露，避免裸公网
    environment:
      # —— new-api 期望的变量 ——
      SQL_DSN: "root:testpass123@tcp(mysql:3306)/new-api-test"
      REDIS_CONN_STRING: "redis://redis"
      # —— 会话/加密根密钥（Critical，2026-07-16 修复）——
      #   过去内联了一个 48 字符默认值(fd17844 引入)：服务器 .env 未设同名键 → compose 插值回落到 git 字面量，
      #   于是「签会话 cookie」与「派生 API token 缓存键的 HMAC」共用一把「进过 git、可被任何仓库读者读到」的根密钥。
      #   风险：读到者可离线用 gorilla/securecookie 伪造 {"id":1,"role":100} 的 root cookie → 免密全站管理员。
      #   修法（fail-closed + 分权）：
      #     · 去掉内联默认，改 `:?`——未在服务器 .env 提供则 compose 直接报错拒绝部署（把「约定覆盖」升级为「强制」）。
      #     · 拆两把：SESSION_SECRET 只签 cookie、CRYPTO_SECRET 只做 HMAC 缓存键派生，禁止同一把复用。
      #   部署前置（务必先做，否则本文件会让 up 失败）：在 /root/newapi-test/.env 写入两把「互不相同」的随机值：
      #     SESSION_SECRET=$(openssl rand -hex 32)   CRYPTO_SECRET=$(openssl rand -hex 32)
      #   轮换会使旧 cookie 全失效（用户需重登）、缓存键重算（无数据损失）。详见 RETRO 2026-07-16 与 CLAUDE.md C1。
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET 必须在服务器 .env 设为随机值，禁止内联默认（内联=把根密钥写进 git）}"
      CRYPTO_SECRET: "${CRYPTO_SECRET:?CRYPTO_SECRET 必须在服务器 .env 设为随机值，且与 SESSION_SECRET 不同（分权，勿复用）}"
      TZ: "Asia/Shanghai"
      PORT: "3000"
      # —— 7c 多档风控：调用前 RPM 限流默认阈值（每分钟每用户，0=关闭）。压测后设 60=合理常用值（≈1 req/s/用户）。——
      RISK_DEFAULT_RPM: "60"
      # —— 计费写放大优化（2026-07-09）：批量聚合额度/统计写，消除 channels.used_quota 等热行锁竞争。——
      #   前提：Redis 为额度权威（cacheDecr* 同步扣 Redis），故 DB 列滞后 ≤INTERVAL 秒不会超扣。
      #   INTERVAL=5：app 崩溃最多丢 5s 的 DB 统计列精度（used_quota/request_count/channel used_quota）；可花余额以 Redis 为准。
      #   激活方式：docker compose -p newapi_test -f deploy/docker-compose.test.yml up -d app（仅重启 app，~5-15s）。
      BATCH_UPDATE_ENABLED: "true"
      BATCH_UPDATE_INTERVAL: "5"
      # —— 自研计费 hook 写放大优化（2026-07-09，发现 #9）：BATCH_UPDATE 只批量 5 类原生计数，覆盖不到
      #   本 fork 追加的两类自研每请求写——mt_wallet_consume_log INSERT + agent_earning_logs/agent_wallets
      #   收益事务（agent_wallets 是每租户热行，同租户并发全串行在其行锁上，是吞吐天花板主嫌）。开启后二者
      #   改进程内缓冲 + 定时批量落库（单事务多行 INSERT + 按租户合并 UPSERT，消除热行争用）；均以 requestID
      #   幂等，SIGTERM 优雅 flush 兜底计划重启，缓冲打满退回同步写。方向安全（只会少计代理收益、绝不多付）。
      #   **默认开启**（2026-07-09 低峰激活）：服务器构建 + 单测通过后启用；真实小流量灰度核对因上游渠道暂缺
      #   未能做，但方向安全（只会少计代理收益、绝不多付）+ requestID 幂等 + SIGTERM 优雅 flush 兜底，故先低峰
      #   开启、生产观察账目一致性。关闭回退：改 "false" 再
      #   `docker compose -p newapi_test -f deploy/docker-compose.test.yml --env-file .env up -d app`。INTERVAL=硬崩溃最坏丢账窗口(秒)。
      AGENT_HOOK_ASYNC_ENABLED: "true"
      AGENT_HOOK_ASYNC_INTERVAL: "2"
      # —— 上游渠道凭据：仅引用服务器 .env 的同名变量，值不入库（compose 自动插值），供后续 relay 自测（5b）用 ——
      UPSTREAM_BASE_URL: "${UPSTREAM_BASE_URL}"
      UPSTREAM_API_KEY: "${UPSTREAM_API_KEY}"
      # —— 微信/支付宝支付：主站进程内真实 SDK（凭据存 DB 管理页表单；已退役 auth-service）——
      # 异步回调公网基址，回填 notify_url（= 此值 + /api/pay/{wechat,alipay}/notify）。
      MT_PAY_NOTIFY_BASE: "${MT_PAY_NOTIFY_BASE:-https://tokendream.wedreamhub.com}"
      # —— 自定义域名（OEM，§6）：内网回写端点共享密钥（引用服务器 .env，值不入库）+ A 记录目标 IP（前端指引）——
      MT_INTERNAL_SECRET: "${MT_INTERNAL_SECRET}"
      MT_SITE_IP: "${MT_SITE_IP:-64.90.4.114}"
    depends_on:
      - mysql
      - redis
    restart: on-failure       # 等待 mysql/redis 就绪期间由此兜底重启

  # 注：原 auth-service 独立支付网关已退役（微信/支付宝改为主站进程内真实 SDK，凭据存 DB）。
  # 不再构建/启动 auth-service 容器；其代码仍在仓库（dormant）。

  mysql:
    image: mysql:8.2
    # 让 root 用 native_password，避免 caching_sha2 在非 TLS 下的公钥交换问题。
    # 计费写放大优化（2026-07-09）：放宽 per-commit fsync，将单连接提交吞吐从 ~523 抬到 ~5763 commits/s（11×）。
    #   innodb-flush-log-at-trx-commit=2：每次 commit 刷 redo 到 OS cache、每秒 fsync 一次 → 进程崩溃不丢，仅宿主机断电丢 ≤1s。
    #   sync-binlog=0：binlog 交由 OS 定期刷盘（本栈 binlog 仅本地、无从库/PITR 需求）。
    # 运行中的实例已由 `SET PERSIST` 写入数据卷 mysqld-auto.cnf；此处 command 供全新卷（from-scratch 部署）兜底。
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-flush-log-at-trx-commit=2
      --sync-binlog=0
    environment:
      MYSQL_ROOT_PASSWORD: "testpass123"
      MYSQL_DATABASE: "new-api-test"
    volumes:
      - mysql_test_data:/var/lib/mysql

  redis:
    image: redis:latest       # new-api 经 REDIS_CONN_STRING=redis://redis 使用（无密码，仅测试）

volumes:
  mysql_test_data:
