# 历史文件名保留为 docker-compose.test.yml，但自 2026-07-03 单栈收敛后，
# 它就是 new-api fork 的唯一现网 / 生产编排，不得当作可销毁测试栈：
#   docker compose -p newapi_test -f deploy/docker-compose.test.yml up -d --build
# 不写 container_name / 外部网络：靠 -p 前缀隔离，默认网络自动创建。
# app 直接构建仓库根的 new-api Dockerfile（多阶段：bun 构建 web/default+classic → go build 内嵌）。
services:
  app:
    build:
      context: ..            # 上下文为仓库根（new-api Dockerfile 在根）
      dockerfile: Dockerfile
    ports:
      # APP_PORT 只用于隔离的恢复演练申请临时端口；生产未设置时仍固定 3100。
      - "127.0.0.1:${APP_PORT:-3100}:3000" # 仅本机回环暴露，避免裸公网
    environment:
      # —— new-api 期望的变量 ——
      # app 不再持有 MySQL root。mysql-access-bootstrap 在每次启动前幂等创建/轮换
      # schema-scoped 用户；密码只存 root:600 的服务器 .env。缺失即 Compose fail-closed。
      SQL_DSN: "${MYSQL_APP_USER:-newapi}:${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD 必须在服务器 .env 提供 64 位十六进制随机值}@tcp(mysql:3306)/new-api-test"
      # Redis default 用户关闭；app 仅使用显式 ACL 用户。账号/密码采用 URI-safe 的
      # 标识符与十六进制格式，redis 启动命令会在读取任何数据前再次验证。
      REDIS_CONN_STRING: "redis://${REDIS_APP_USER:-newapi}:${REDIS_PASSWORD:?REDIS_PASSWORD 必须在服务器 .env 提供 64 位十六进制随机值}@redis"
      # —— 会话/加密根密钥（Critical，2026-07-16 修复）——
      #   过去内联了一个 48 字符默认值(fd17844 引入)：服务器 .env 未设同名键 → compose 插值回落到 git 字面量，
      #   于是「签会话 cookie」与「派生 API token 缓存键的 HMAC」共用一把「进过 git、可被任何仓库读者读到」的根密钥。
      #   风险：读到者可离线用 gorilla/securecookie 伪造 {"id":1,"role":100} 的 root cookie → 免密全站管理员。
      #   修法（fail-closed + 分权）：
      #     · 去掉内联默认，改 `:?`——未在服务器 .env 提供则 compose 直接报错拒绝部署（把「约定覆盖」升级为「强制」）。
      #     · 拆两把：SESSION_SECRET 只签 cookie、CRYPTO_SECRET 只做 HMAC 缓存键派生，禁止同一把复用。
      #   部署前置（务必先做，否则本文件会让 up 失败）：在 /root/newapi-test/.env 写入两把「互不相同」的随机值：
      #     SESSION_SECRET=$(openssl rand -hex 32)   CRYPTO_SECRET=$(openssl rand -hex 32)
      #   轮换会使旧 cookie 全失效（用户需重登）、缓存键重算（无数据损失）。详见 RETRO 2026-07-16 与 CLAUDE.md C1。
      SESSION_SECRET: "${SESSION_SECRET:?SESSION_SECRET 必须在服务器 .env 设为随机值，禁止内联默认（内联=把根密钥写进 git）}"
      CRYPTO_SECRET: "${CRYPTO_SECRET:?CRYPTO_SECRET 必须在服务器 .env 设为随机值，且与 SESSION_SECRET 不同（分权，勿复用）}"
      DEPLOYMENT_ENV: "production"
      SESSION_COOKIE_SECURE: "true"
      TZ: "Asia/Shanghai"
      PORT: "3000"
      # —— 7c 多档风控：调用前 RPM 限流默认阈值（每分钟每用户，0=关闭）。压测后设 60=合理常用值（≈1 req/s/用户）。——
      RISK_DEFAULT_RPM: "60"
      # —— 财务持久化安全默认 ——
      # 余额/额度以数据库条件更新为权威，Redis 只作缓存/风控状态，不能用缓存成功掩盖 DB 写失败。
      # 生产禁用进程内批量计费与代理 hook 缓冲，避免进程崩溃窗口丢失扣费统计、消费台账或可提现收益。
      # 若未来启用，必须先把队列改为持久化 outbox 并用崩溃恢复/幂等重放测试证明零丢账。
      BATCH_UPDATE_ENABLED: "false"
      AGENT_HOOK_ASYNC_ENABLED: "false"
      # —— 上游渠道凭据：仅引用服务器 .env 的同名变量，值不入库（compose 自动插值），供后续 relay 自测（5b）用 ——
      UPSTREAM_BASE_URL: "${UPSTREAM_BASE_URL}"
      UPSTREAM_API_KEY: "${UPSTREAM_API_KEY}"
      # —— 微信/支付宝支付：主站进程内真实 SDK（凭据存 DB 管理页表单；已退役 auth-service）——
      # 异步回调公网基址，回填 notify_url（= 此值 + /api/pay/{wechat,alipay}/notify）。
      MT_PAY_NOTIFY_BASE: "${MT_PAY_NOTIFY_BASE:-https://tokendream.wedreamhub.com}"
      # —— 自定义域名（OEM，§6）：内网回写端点共享密钥（引用服务器 .env，值不入库）+ A 记录目标 IP（前端指引）——
      MT_INTERNAL_SECRET: "${MT_INTERNAL_SECRET:?MT_INTERNAL_SECRET 必须在服务器 .env 设为随机值}"
      MT_SITE_IP: "${MT_SITE_IP:-64.90.4.114}"
    depends_on:
      mysql-access-bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_started
    # Docker health 只判进程存活，避免 DB/Redis 短故障触发无意义重启。
    # 发布与巡检另用 /health/ready 做直连 DB + 已配置 Redis 验收。
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--timeout=5", "--output-document=/dev/null", "http://127.0.0.1:3000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    restart: on-failure       # 等待 mysql/redis 就绪期间由此兜底重启

  # 注：原 auth-service 独立支付网关已退役（微信/支付宝改为主站进程内真实 SDK，凭据存 DB）。
  # 不再构建/启动 auth-service 容器；其代码仍在仓库（dormant）。

  mysql:
    # 先锁定现网已验证的 linux/amd64 制品；8.4 LTS 必须按 data-services-hardening.md
    # 在隔离恢复演练后用 MYSQL_IMAGE 覆盖，禁止直接复用已升级 datadir 回退。
    image: "${MYSQL_IMAGE:-mysql:8.2@sha256:212fe73edca5df6ff14826d5eb975c914bfb91f82a2e923f9050568f99525da1}"
    # 保持 MySQL 当前默认认证插件（8.2/8.4 均为 caching_sha2_password）；Go MySQL
    # driver 已支持该协议。不要固定 8.4 已移除的 default-authentication-plugin。
    # 财务状态必须以已提交事务为恢复边界：redo 与 binlog 都在每次 commit 时持久化。
    # 禁止为吞吐改成 innodb_flush_log_at_trx_commit=2 / sync_binlog=0；宿主掉电会让已确认的
    # 额度、支付或收益事务从磁盘消失。存量实例若曾 SET PERSIST 为宽松值，发布前须恢复为 1/1。
    command: >
      --innodb-flush-log-at-trx-commit=1
      --sync-binlog=1
    environment:
      # 真值只存服务器 .env（C1）；仅新数据卷首次初始化时被 mysqld 消费，存量卷改密码见 app.SQL_DSN 处注释。
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必须在服务器 .env 提供，禁止内联默认（见 C1）}"
      MYSQL_DATABASE: "new-api-test"
    volumes:
      - mysql_test_data:/var/lib/mysql
    # 数据服务同样需自愈：OOM/宿主重启后自动拉起（此前缺失，崩了需人工介入）。见 RETRO 2026-07-16。
    restart: unless-stopped

  # 对已有 volume，MYSQL_USER/MYSQL_PASSWORD 初始化变量不会再次执行；因此用一次性
  # bootstrap 通过 root 幂等创建/轮换 schema 专用账号，成功后 app 才可启动。
  # 密码通过环境 + SQL stdin 传入，不出现在 mysql 客户端 argv。
  mysql-access-bootstrap:
    image: "${MYSQL_IMAGE:-mysql:8.2@sha256:212fe73edca5df6ff14826d5eb975c914bfb91f82a2e923f9050568f99525da1}"
    depends_on:
      mysql:
        condition: service_started
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必须在服务器 .env 提供}"
      MYSQL_APP_USER: "${MYSQL_APP_USER:-newapi}"
      MYSQL_APP_PASSWORD: "${MYSQL_APP_PASSWORD:?MYSQL_APP_PASSWORD 必须在服务器 .env 提供 64 位十六进制随机值}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$$MYSQL_APP_USER" in
          ''|*[!A-Za-z0-9_]*) echo 'MYSQL_APP_USER must be an alphanumeric SQL identifier' >&2; exit 64 ;;
        esac
        case "$$MYSQL_APP_PASSWORD" in
          *[!0-9a-fA-F]*|'') echo 'MYSQL_APP_PASSWORD must be hexadecimal' >&2; exit 64 ;;
        esac
        [ "$${#MYSQL_APP_PASSWORD}" -ge 64 ] && [ "$${#MYSQL_APP_PASSWORD}" -le 128 ] || {
          echo 'MYSQL_APP_PASSWORD must contain 64-128 hexadecimal characters' >&2
          exit 64
        }
        deadline=$$(( $$(date +%s) + 90 ))
        until MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -hmysql -uroot --silent; do
          [ "$$(date +%s)" -lt "$$deadline" ] || { echo 'MySQL did not become ready' >&2; exit 1; }
          sleep 2
        done
        printf "CREATE USER IF NOT EXISTS '%s'@'%%' IDENTIFIED BY '%s';\nALTER USER '%s'@'%%' IDENTIFIED BY '%s';\nGRANT ALL PRIVILEGES ON \`new-api-test\`.* TO '%s'@'%%';\n" \
          "$$MYSQL_APP_USER" "$$MYSQL_APP_PASSWORD" "$$MYSQL_APP_USER" "$$MYSQL_APP_PASSWORD" "$$MYSQL_APP_USER" \
          | MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -hmysql -uroot
        MYSQL_PWD="$$MYSQL_APP_PASSWORD" mysql -hmysql -u"$$MYSQL_APP_USER" -Dnew-api-test -Nse 'SELECT DATABASE()' \
          | grep -Fx 'new-api-test' >/dev/null
    restart: "no"

  redis:
    # 固定到现网已写入 RDB v14 的 Redis 8.8 补丁版；降级到 Redis 7 无法读取既有 AOF/RDB。
    image: "${REDIS_IMAGE:-redis:8.8.0@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b}"
    # —— 持久化（Critical，2026-07-16 修复：限购去重键此前只活在**无卷** Redis，容器重建即全站 Trial 终身限购
    #   一次性归零、且限购在 DB 无任何后备台账 → 所有历史买家可再薅一份，无日志无告警）——
    #   ① 挂 named volume redis_test_data:/data —— RDB/AOF 落盘到卷，键跨容器重建 / `compose down` / 镜像重拉
    #      全部存活，仅 `down -v`（显式删卷）才清空。补上「余额丢 ≤5s(MySQL 后备) 而限购丢全部」的不对称。
    #   ② --appendonly yes 开 AOF（默认 everysec fsync）：进程崩溃至多丢 ≤1s 写，强于默认仅 RDB 快照
    #      （save 3600/300/60，最坏丢 ~300s）。AOF 与 RDB 并存作双保险，均落在同一持久卷。
    #   注：本改动需一次容器重建（`up -d` 会 recreate redis）方生效；重建瞬间旧内存键会丢——线上现状本就 0 键
    #      （主审员实测 risk:trial:* = 0），故无损失。详见 RETRO 2026-07-16 与 CLAUDE.md C4。
    environment:
      REDIS_APP_USER: "${REDIS_APP_USER:-newapi}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD 必须在服务器 .env 提供 64 位十六进制随机值}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$$REDIS_APP_USER" in
          ''|*[!A-Za-z0-9_-]*) echo 'REDIS_APP_USER must be an ACL-safe identifier' >&2; exit 64 ;;
        esac
        case "$$REDIS_PASSWORD" in
          *[!0-9a-fA-F]*|'') echo 'REDIS_PASSWORD must be hexadecimal' >&2; exit 64 ;;
        esac
        [ "$${#REDIS_PASSWORD}" -ge 64 ] && [ "$${#REDIS_PASSWORD}" -le 128 ] || {
          echo 'REDIS_PASSWORD must contain 64-128 hexadecimal characters' >&2
          exit 64
        }
        umask 077
        printf 'user default off\nuser %s on >%s ~* +@all -acl -config -debug -flushall -flushdb -migrate -module -monitor -replicaof -slaveof -shutdown\n' \
          "$$REDIS_APP_USER" "$$REDIS_PASSWORD" > /run/newapi-users.acl
        chown redis:redis /run/newapi-users.acl
        # 继续走官方 entrypoint，让 Redis 从 root 降权到镜像内 redis 用户；直接
        # exec redis-server 会绕过官方 gosu 降权逻辑。
        exec docker-entrypoint.sh redis-server --appendonly yes --aclfile /run/newapi-users.acl
    volumes:
      - redis_test_data:/data
    # OOM/镜像升级/宿主重启后自愈：无此策略则 redis 崩了不会自己起来，需人工介入。
    # 配合 mtwire/risk.go 的 fail-open（Redis 不可用时 /v1 放行而非 500），缩短「限流暂失效」窗口。见 RETRO 2026-07-16。
    restart: unless-stopped

volumes:
  mysql_test_data:
  redis_test_data:
