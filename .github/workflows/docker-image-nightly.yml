name: Publish Docker image (nightly)

permissions:
  contents: read
  deployments: read

on:
  push:
    branches:
      - nightly
  workflow_dispatch:
    inputs:
      name:
        description: "reason"
        required: false

concurrency:
  group: publish-docker-nightly
  cancel-in-progress: false

jobs:
  verify:
    name: Verify nightly source before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out nightly source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Validate source and determine nightly version
        id: version
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [ "$SOURCE_REF" != 'refs/heads/nightly' ]; then
            echo "::error::Nightly images may only be published from refs/heads/nightly"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo "::error::Checked-out commit does not match the workflow commit"
            exit 1
          }
          VERSION="nightly-$(git show -s --format=%cs | tr -d '-')-${GITHUB_SHA::12}"
          if [[ ! "$VERSION" =~ ^nightly-[0-9]{8}-[0-9a-f]{12}$ ]]; then
            echo "::error::Generated nightly version is invalid"
            exit 1
          fi
          printf 'value=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fail closed unless container publish Environment is protected
        env:
          GH_TOKEN: ${{ secrets.ENVIRONMENT_AUDIT_TOKEN || github.token }}
        run: bash scripts/verify-github-environments.sh container-publish

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            bulb-orbit/v2/package-lock.json
            electron/package-lock.json

      - name: Run shared preflight
        env:
          RUN_ORBIT_E2E: '1'
        run: bash scripts/preflight.sh

  build_single_arch:
    name: Build & push (${{ matrix.arch }}) [native]
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    environment: container-publish

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out (shallow)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Determine nightly version
        id: version
        env:
          RESOLVED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          VERSION="$RESOLVED_VERSION"
          if [[ ! "$VERSION" =~ ^nightly-[0-9]{8}-[0-9a-f]{12}$ ]]; then
            echo "::error::Resolved nightly version is invalid"
            exit 1
          fi
          echo "$VERSION" > VERSION
          printf 'value=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          echo "Publishing version: $VERSION for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: |
            calciumion/new-api

      - name: Build & push single-arch
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            calciumion/new-api:${{ steps.version.outputs.value }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image with cosign
        run: cosign sign --yes calciumion/new-api@${{ steps.build.outputs.digest }}

  create_manifests:
    name: Create multi-arch manifests (Docker Hub)
    needs: [verify, build_single_arch]
    runs-on: ubuntu-latest
    environment: container-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set nightly version
        env:
          RESOLVED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [[ ! "$RESOLVED_VERSION" =~ ^nightly-[0-9]{8}-[0-9a-f]{12}$ ]]; then
            echo "::error::Resolved nightly version is invalid"
            exit 1
          fi
          printf 'VERSION=%s\n' "$RESOLVED_VERSION" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & push manifest (Docker Hub - versioned nightly)
        run: |
          docker buildx imagetools create \
            --metadata-file manifest-nightly.json \
            -t calciumion/new-api:${VERSION} \
            calciumion/new-api:${VERSION}-amd64 \
            calciumion/new-api:${VERSION}-arm64
          DIGEST=$(jq -r '.["containerimage.descriptor"].digest // empty' manifest-nightly.json)
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Nightly manifest did not return a valid digest"
            exit 1
          fi
          printf 'MANIFEST_DIGEST=%s\n' "$DIGEST" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign versioned multi-arch manifest
        run: cosign sign --yes calciumion/new-api@${MANIFEST_DIGEST}

      - name: Update signed nightly alias
        run: |
          docker buildx imagetools create \
            -t calciumion/new-api:nightly \
            calciumion/new-api@${MANIFEST_DIGEST}
