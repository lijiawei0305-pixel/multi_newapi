name: Release (Linux, macOS, Windows)

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'reason'
        required: false
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: formal-release-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    name: Reuse full CI verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Validate formal release tag and ancestry
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERIFIED_COMMIT=$(git rev-parse HEAD)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Formal releases require a strict vMAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH tag"
              exit 1
            fi
            TAG_COMMIT=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
            test "$TAG_COMMIT" = "$VERIFIED_COMMIT" || {
              echo "::error::Checked-out commit does not match the release tag"
              exit 1
            }
            git fetch --no-tags origin main:refs/remotes/origin/main
            git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main || {
              echo "::error::Refusing to release a tag whose commit is not on origin/main"
              exit 1
            }
            VERSION="$RELEASE_TAG"
          else
            VERSION="dev-${VERIFIED_COMMIT:0:12}"
          fi
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$VERIFIED_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Fail closed unless release publish Environment is protected
        env:
          GH_TOKEN: ${{ secrets.ENVIRONMENT_AUDIT_TOKEN || github.token }}
          GITHUB_ENVIRONMENT_APPROVALS_REQUIRED: 'false'
        run: bash scripts/verify-github-environments.sh release-publish

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            bulb-orbit/v2/package-lock.json
            electron/package-lock.json

      - name: Run shared preflight
        env:
          RUN_ORBIT_E2E: '1'
        run: bash scripts/preflight.sh

  linux:
    name: Linux release artifacts
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.commit }}

      - name: Determine version
        env:
          VERIFIED_VERSION: ${{ needs.verify.outputs.version }}
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          VERSION="$VERIFIED_VERSION"
          test "$(git rev-parse HEAD)" = "$VERIFIED_COMMIT"
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Release version is not artifact-safe"
            exit 1
          fi
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install frozen web dependencies
        working-directory: web
        run: bun install --frozen-lockfile --linker=isolated

      - name: Build Default frontend
        working-directory: web/default
        run: VITE_REACT_APP_VERSION="$VERSION" bun run build

      - name: Build Classic frontend
        working-directory: web/classic
        run: VITE_REACT_APP_VERSION="$VERSION" bun run build

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and verify amd64 backend
        run: |
          go build -ldflags "-s -w -X github.com/QuantumNous/new-api/common.Version=$VERSION -extldflags '-static'" -o "new-api-$VERSION"
          test "$(./new-api-$VERSION --version)" = "$VERSION"

      - name: Build and verify arm64 backend
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user-static
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 \
            go build -ldflags "-s -w -X github.com/QuantumNous/new-api/common.Version=$VERSION -extldflags '-static'" \
            -o "new-api-arm64-$VERSION"
          test "$(qemu-aarch64-static ./new-api-arm64-$VERSION --version)" = "$VERSION"

      - name: Generate checksums
        run: sha256sum new-api-* LICENSE NOTICE THIRD-PARTY-LICENSES.md > checksums-linux.txt

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux
          path: |
            new-api-*
            checksums-linux.txt
            LICENSE
            NOTICE
            THIRD-PARTY-LICENSES.md
          if-no-files-found: error

  macos:
    name: macOS release artifacts
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.commit }}

      - name: Determine version
        env:
          VERIFIED_VERSION: ${{ needs.verify.outputs.version }}
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          VERSION="$VERIFIED_VERSION"
          test "$(git rev-parse HEAD)" = "$VERIFIED_COMMIT"
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Release version is not artifact-safe"
            exit 1
          fi
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install frozen web dependencies
        working-directory: web
        run: bun install --frozen-lockfile --linker=isolated

      - name: Build Default frontend
        working-directory: web/default
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: VITE_REACT_APP_VERSION="$VERSION" bun run build

      - name: Build Classic frontend
        working-directory: web/classic
        run: VITE_REACT_APP_VERSION="$VERSION" bun run build

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and verify backend
        run: |
          go build -ldflags "-s -w -X github.com/QuantumNous/new-api/common.Version=$VERSION" -o "new-api-macos-$VERSION"
          test "$(./new-api-macos-$VERSION --version)" = "$VERSION"

      - name: Generate checksums
        run: shasum -a 256 new-api-macos-* LICENSE NOTICE THIRD-PARTY-LICENSES.md > checksums-macos.txt

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          path: |
            new-api-macos-*
            checksums-macos.txt
            LICENSE
            NOTICE
            THIRD-PARTY-LICENSES.md
          if-no-files-found: error

  windows:
    name: Windows release artifacts
    needs: verify
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.commit }}

      - name: Determine version
        env:
          VERIFIED_VERSION: ${{ needs.verify.outputs.version }}
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          VERSION="$VERIFIED_VERSION"
          test "$(git rev-parse HEAD)" = "$VERIFIED_COMMIT"
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Release version is not artifact-safe"
            exit 1
          fi
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install frozen web dependencies
        working-directory: web
        run: bun install --frozen-lockfile --linker=isolated

      - name: Build Default frontend
        working-directory: web/default
        run: VITE_REACT_APP_VERSION="$VERSION" bun run build

      - name: Build Classic frontend
        working-directory: web/classic
        run: VITE_REACT_APP_VERSION="$VERSION" bun run build

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and verify backend
        run: |
          go build -ldflags "-s -w -X github.com/QuantumNous/new-api/common.Version=$VERSION" -o "new-api-$VERSION.exe"
          actual=$(./new-api-$VERSION.exe --version | tr -d '\r')
          test "$actual" = "$VERSION"

      - name: Generate checksums
        run: sha256sum new-api-*.exe LICENSE NOTICE THIRD-PARTY-LICENSES.md > checksums-windows.txt

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: |
            new-api-*.exe
            checksums-windows.txt
            LICENSE
            NOTICE
            THIRD-PARTY-LICENSES.md
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    environment: release-publish
    permissions:
      contents: write
    steps:
      - name: Download verified artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe # v2
        with:
          files: release-assets/**
          draft: true
