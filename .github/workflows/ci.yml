name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · build / vet / test -race
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove clean checkout boundary
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.sha }}
        run: bash scripts/verify-clean-checkout.sh
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run backend gates
        env:
          PREFLIGHT_SCOPE: backend
        run: bash scripts/preflight.sh

  windows-response-spool:
    name: Windows · private response spool runtime
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Assert Windows spool runtime test is present
        shell: pwsh
        run: |
          $tests = go test -list '^TestBufferedResponseWindowsRuntimeUsesProtectedPrivateDACLs$' ./common
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($tests -notcontains 'TestBufferedResponseWindowsRuntimeUsesProtectedPrivateDACLs') {
            throw 'Windows private spool runtime test was not compiled'
          }
      - name: Verify protected private spool DACLs at runtime
        run: go test -count=1 -run '^TestBufferedResponseWindowsRuntimeUsesProtectedPrivateDACLs$' ./common
      - name: Verify Windows stale spool lock cleanup
        run: go test -count=1 -run '^TestBufferedResponseSpoolStaleCleanupIsPrefixAgeAndLockSafe$' ./common

  database-compatibility:
    name: Billing durability · MySQL 8 / PostgreSQL 16 / ClickHouse 24.8
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: newapi_billing_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      postgres:
        image: postgres:16@sha256:33f923b05f64ca54ac4401c01126a6b92afe839a0aa0a52bc5aeb5cc958e5f20
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: newapi_billing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d newapi_billing_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      clickhouse:
        image: clickhouse/clickhouse-server:24.8@sha256:1ffa82edee000a42c09313bd9f1293d94c570aee74babc1b3ca9983a35fa597b
        env:
          CLICKHOUSE_DB: new_api_logs_test
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: test-only
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 9000:9000
        options: >-
          --health-cmd="clickhouse-client --user default --password test-only --query 'SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify MySQL conditional reserve atomicity
        env:
          TEST_BILLING_DB_ALLOW_DROP: '1'
          TEST_BILLING_DB_DIALECT: mysql
          TEST_BILLING_DB_DSN: root:test-password@tcp(127.0.0.1:3306)/newapi_billing_test?charset=utf8mb4&parseTime=True&loc=UTC
        run: go test -race -count=1 -run '^TestAtomicQuotaReserveExternalDialect$' ./model
      - name: Verify MySQL agent fixed-point migration and rollback compatibility
        env:
          TEST_AGENT_DB_ALLOW_DROP: '1'
          TEST_AGENT_DB_DIALECT: mysql
          TEST_AGENT_DB_DSN: root:test-password@tcp(127.0.0.1:3306)/newapi_billing_test?charset=utf8mb4&parseTime=True&loc=UTC&clientFoundRows=true
        run: go test -race -count=1 -run '^TestAgentMoneyExternalDialect$' ./internal/agent/gormrepo
      - name: Verify MySQL agent default affected-row semantics
        env:
          TEST_AGENT_DB_ALLOW_DROP: '1'
          TEST_AGENT_DB_DIALECT: mysql
          TEST_AGENT_DB_DSN: root:test-password@tcp(127.0.0.1:3306)/newapi_billing_test?charset=utf8mb4&parseTime=True&loc=UTC
        run: go test -race -count=1 -run '^TestAgentMoneyExternalDialect$' ./internal/agent/gormrepo
      - name: Verify PostgreSQL conditional reserve atomicity
        env:
          TEST_BILLING_DB_ALLOW_DROP: '1'
          TEST_BILLING_DB_DIALECT: postgres
          TEST_BILLING_DB_DSN: host=127.0.0.1 user=postgres password=test-password dbname=newapi_billing_test port=5432 sslmode=disable TimeZone=UTC
        run: go test -race -count=1 -run '^TestAtomicQuotaReserveExternalDialect$' ./model
      - name: Verify PostgreSQL agent fixed-point migration and rollback compatibility
        env:
          TEST_AGENT_DB_ALLOW_DROP: '1'
          TEST_AGENT_DB_DIALECT: postgres
          TEST_AGENT_DB_DSN: host=127.0.0.1 user=postgres password=test-password dbname=newapi_billing_test port=5432 sslmode=disable TimeZone=UTC
        run: go test -race -count=1 -run '^TestAgentMoneyExternalDialect$' ./internal/agent/gormrepo
      - name: Verify ClickHouse projection crash replay
        env:
          TEST_CLICKHOUSE_ALLOW_DROP: '1'
          TEST_CLICKHOUSE_DSN: clickhouse://default:test-only@127.0.0.1:9000/new_api_logs_test
        run: go test -count=1 -run '^TestBillingProjectionRealClickHouseCrashReplay$' ./model

  default-frontend:
    name: Default · test / typecheck / lint / format / i18n / size / deps / build / bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
      - name: Run Default gates
        env:
          PREFLIGHT_SCOPE: default
        run: bash scripts/preflight.sh

  classic-frontend:
    name: Classic · frozen deps / format / lint / security test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
      - name: Run Classic gates
        env:
          PREFLIGHT_SCOPE: classic
        run: bash scripts/preflight.sh

  orbit:
    name: Orbit · typecheck / lint / test / build / e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: bulb-orbit/v2/package-lock.json
      - name: Run Orbit gates
        env:
          PREFLIGHT_SCOPE: orbit
          RUN_ORBIT_E2E: '1'
        run: bash scripts/preflight.sh

  electron:
    name: Electron · clean Linux package smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Run Electron package smoke
        env:
          PREFLIGHT_SCOPE: electron
        run: bash scripts/preflight.sh
