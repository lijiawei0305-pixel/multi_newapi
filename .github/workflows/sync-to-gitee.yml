name: Sync Release to Gitee

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag to sync (e.g. v1.0.0)'
        required: true
        type: string

# 配置你的 Gitee 仓库信息
env:
  GITEE_OWNER: 'QuantumNous'  # 修改为你的 Gitee 用户名
  GITEE_REPO: 'new-api'                # 修改为你的 Gitee 仓库名

jobs:
  sync-to-gitee:
    runs-on: sync
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Get Release Info
        id: release_info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Release tag is invalid"
            exit 1
          fi
          # 获取 release 信息
          RELEASE_INFO=$(gh release view "$TAG_NAME" --json name,body,tagName,targetCommitish)
          
          RELEASE_NAME=$(echo "$RELEASE_INFO" | jq -r '.name')
          TARGET_COMMITISH=$(echo "$RELEASE_INFO" | jq -r '.targetCommitish')
          
          # Every release field is untrusted content. Random delimiters prevent
          # names or bodies containing workflow-command text from forging a
          # second output value.
          NAME_DELIMITER="release_name_${GITHUB_RUN_ID}_${RANDOM}_${RANDOM}"
          COMMIT_DELIMITER="target_commit_${GITHUB_RUN_ID}_${RANDOM}_${RANDOM}"
          BODY_DELIMITER="release_body_${GITHUB_RUN_ID}_${RANDOM}_${RANDOM}"
          {
            echo "release_name<<$NAME_DELIMITER"
            printf '%s\n' "$RELEASE_NAME"
            echo "$NAME_DELIMITER"
            echo "target_commitish<<$COMMIT_DELIMITER"
            printf '%s\n' "$TARGET_COMMITISH"
            echo "$COMMIT_DELIMITER"
            echo "release_body<<$BODY_DELIMITER"
            printf '%s\n' "$RELEASE_INFO" | jq -r '.body'
            echo "$BODY_DELIMITER"
          } >> "$GITHUB_OUTPUT"
          
          # 下载 release 的所有附件
          gh release download "$TAG_NAME" --dir ./release_assets || echo "No assets to download"
          
          # 列出下载的文件
          ls -la ./release_assets/ || echo "No assets directory"

      - name: Create Gitee Release
        id: create_release
        uses: nICEnnnnnnnLee/action-gitee-release@44b412edade0c837fb0ad7d73f4674ec07c8b722 # v2.0.0
        with:
          gitee_action: create_release
          gitee_owner: ${{ env.GITEE_OWNER }}
          gitee_repo: ${{ env.GITEE_REPO }}
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_tag_name: ${{ github.event.inputs.tag_name }}
          gitee_release_name: ${{ steps.release_info.outputs.release_name }}
          gitee_release_body: ${{ steps.release_info.outputs.release_body }}
          gitee_target_commitish: ${{ steps.release_info.outputs.target_commitish }}

      - name: Upload Assets to Gitee
        if: hashFiles('release_assets/*') != ''
        uses: nICEnnnnnnnLee/action-gitee-release@44b412edade0c837fb0ad7d73f4674ec07c8b722 # v2.0.0
        with:
          gitee_action: upload_asset
          gitee_owner: ${{ env.GITEE_OWNER }}
          gitee_repo: ${{ env.GITEE_REPO }}
          gitee_token: ${{ secrets.GITEE_TOKEN }}
          gitee_release_id: ${{ steps.create_release.outputs.release-id }}
          gitee_upload_retry_times: 3
          gitee_files: |
            release_assets/*

      - name: Cleanup
        if: always()
        run: |
          rm -rf release_assets/

      - name: Summary
        if: success()
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          echo "✅ Successfully synced release $TAG_NAME to Gitee!"
          echo "🔗 Gitee Release URL: https://gitee.com/${GITEE_OWNER}/${GITEE_REPO}/releases/tag/$TAG_NAME"
