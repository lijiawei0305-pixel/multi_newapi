name: Dependency Audit

# 每日主动扫描三棵前端/工具链依赖树的安全公告。
# 动机(2026-07-25 事故):新公告发布后,第一个发现者是下一次无关代码推送的
# 红色 CI——定位成本高且阻塞交付。本工作流让公告在发布当天即以独立失败暴露,
# 与功能推送解耦。门禁逻辑与 CI 完全一致(scripts/audit-gate.mjs + 豁免清单,
# 豁免到期同样在这里先变红)。Go 侧已有 govulncheck 走 CI backend 门,不重复。

on:
  schedule:
    - cron: '20 22 * * *' # 每日 06:20 (Asia/Shanghai)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: bun/npm audit · web / orbit / electron
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
      - name: Install web workspace (frozen)
        run: cd web && bun install --frozen-lockfile --linker=isolated
      - name: Audit web (bun)
        run: node scripts/audit-gate.mjs --tool bun --dir web --scope web
      - name: Audit orbit (npm, lock-only)
        run: node scripts/audit-gate.mjs --tool npm --dir bulb-orbit/v2 --scope orbit --level moderate
      - name: Audit electron (npm, lock-only)
        run: node scripts/audit-gate.mjs --tool npm --dir electron --scope electron --level moderate
