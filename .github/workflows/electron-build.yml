name: Build Electron App

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: formal-release-${{ github.ref_name || github.run_id }}
  cancel-in-progress: false

jobs:
  verify:
    name: Reuse full CI verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate formal release tag and ancestry
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERIFIED_COMMIT=$(git rev-parse HEAD)
          [[ "$GITHUB_REF" == refs/tags/* ]] || {
            echo "::error::Electron release workflow_dispatch must select an existing version tag"
            exit 1
          }
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Electron releases require a strict vMAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH tag"
            exit 1
          fi
          TAG_COMMIT=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          test "$TAG_COMMIT" = "$VERIFIED_COMMIT" || {
            echo "::error::Checked-out commit does not match the release tag"
            exit 1
          }
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main || {
            echo "::error::Refusing to release a tag whose commit is not on origin/main"
            exit 1
          }
          VERSION="$RELEASE_TAG"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$VERIFIED_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Fail closed unless release publish Environment is protected
        env:
          GH_TOKEN: ${{ secrets.ENVIRONMENT_AUDIT_TOKEN || github.token }}
        run: bash scripts/verify-github-environments.sh release-publish

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            bulb-orbit/v2/package-lock.json
            electron/package-lock.json

      - name: Run shared preflight
        env:
          RUN_ORBIT_E2E: '1'
        run: bash scripts/preflight.sh

  build:
    name: Build Windows Electron package
    needs: verify
    runs-on: windows-latest
    environment: release-publish
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.commit }}

      - name: Resolve backend and Electron versions
        env:
          VERIFIED_VERSION: ${{ needs.verify.outputs.version }}
          VERIFIED_COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          VERSION="$VERIFIED_VERSION"
          test "$(git rev-parse HEAD)" = "$VERIFIED_COMMIT"
          if [[ ! "$VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Backend version is not artifact-safe"
            exit 1
          fi
          RAW_VERSION=${VERSION#v}
          if [[ "$RAW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            ELECTRON_VERSION=$RAW_VERSION
          else
            ELECTRON_VERSION="0.0.0-${GITHUB_SHA:0:7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ELECTRON_VERSION=$ELECTRON_VERSION" >> "$GITHUB_ENV"

      - name: Require Windows signing identity
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: |
          test -n "$CSC_LINK" || {
            echo "::error::Formal Electron releases require WINDOWS_CSC_LINK"
            exit 1
          }
          test -n "$CSC_KEY_PASSWORD" || {
            echo "::error::Formal Electron releases require WINDOWS_CSC_KEY_PASSWORD"
            exit 1
          }

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install frozen web dependencies
        working-directory: web
        run: bun install --frozen-lockfile --linker=isolated

      - name: Build Default frontend
        working-directory: web/default
        run: VITE_REACT_APP_VERSION="$VERSION" bun run build

      - name: Build Classic frontend
        working-directory: web/classic
        run: VITE_REACT_APP_VERSION="$VERSION" bun run build

      - name: Build and verify embedded Go backend
        run: |
          go build -ldflags "-s -w -X github.com/QuantumNous/new-api/common.Version=$VERSION" -o new-api.exe
          actual=$(./new-api.exe --version | tr -d '\r')
          test "$actual" = "$VERSION"

      - name: Install frozen Electron dependencies and set package version
        working-directory: electron
        run: |
          npm ci
          npm version "$ELECTRON_VERSION" --no-git-tag-version --allow-same-version

      - name: Build Electron app
        working-directory: electron
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npm run build:win

      - name: Verify Authenticode signatures
        shell: pwsh
        run: |
          $artifacts = @(Get-ChildItem -Path electron/dist -Filter *.exe -File)
          if ($artifacts.Count -eq 0) {
            throw 'Electron build produced no Windows executable artifacts'
          }
          foreach ($artifact in $artifacts) {
            $signature = Get-AuthenticodeSignature -FilePath $artifact.FullName
            if ($signature.Status -ne 'Valid') {
              throw "Invalid Authenticode signature for $($artifact.Name): $($signature.Status)"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Authenticode signature for $($artifact.Name) is not timestamped"
            }
          }

      - name: Verify packaged backend version
        run: |
          packaged_backend=electron/dist/win-unpacked/resources/bin/new-api.exe
          test -f "$packaged_backend"
          actual=$("$packaged_backend" --version | tr -d '\r')
          test "$actual" = "$VERSION"

      - name: Generate Electron checksums
        working-directory: electron/dist
        run: sha256sum *.exe > checksums-electron.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build
          path: |
            electron/dist/*.exe
            electron/dist/checksums-electron.txt
          if-no-files-found: error

  release:
    name: Publish Electron artifacts
    needs: build
    runs-on: ubuntu-latest
    environment: release-publish
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-build
          path: windows-build

      - name: Upload to Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: windows-build/*
          draft: true
