name: Publish Docker image (Multi-arch)

permissions:
  actions: read
  contents: read
  deployments: read

concurrency:
  group: publish-docker-tag-${{ github.event.inputs.tag || github.ref_name || github.run_id }}
  cancel-in-progress: false

on:
  push:
    tags:
      - '*'
      - '!nightly*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build (e.g., v0.10.8-alpha.3)'
        required: true
        type: string

jobs:
  verify:
    name: Verify tagged source before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      tag_commit: ${{ steps.version.outputs.tag_commit }}
      staging_prefix: ${{ steps.version.outputs.staging_prefix }}
      is_stable: ${{ steps.version.outputs.is_stable }}
    steps:
      - name: Check out requested tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.sha }}

      - name: Validate tag and main-branch ancestry
        id: version
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          TAG=${REQUESTED_TAG:-$PUSH_TAG}
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Docker publishing requires a semantic version tag without build metadata"
            exit 1
          fi
          if (( ${#TAG} > 80 )) || [[ "$TAG" =~ -(amd64|arm64)$ ]]; then
            echo "::error::Tag is too long or collides with the internal architecture namespace"
            exit 1
          fi
          TAG_COMMIT=$(git rev-parse "refs/tags/$TAG^{commit}" 2>/dev/null) || {
            echo "::error::Tag '$TAG' does not exist"
            exit 1
          }
          test "$TAG_COMMIT" = "$(git rev-parse HEAD)" || {
            echo "::error::Checked-out commit does not match tag '$TAG'"
            exit 1
          }
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$TAG_COMMIT" refs/remotes/origin/main || {
            echo "::error::Refusing to publish a tag whose commit is not on origin/main"
            exit 1
          }
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'tag_commit=%s\n' "$TAG_COMMIT" >> "$GITHUB_OUTPUT"
          printf 'staging_prefix=%s-%s-%s-%s\n' \
            "$TAG" "${TAG_COMMIT:0:12}" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'is_stable=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_stable=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Fail closed unless container publish Environment is protected
        env:
          GH_TOKEN: ${{ secrets.ENVIRONMENT_AUDIT_TOKEN || github.token }}
        run: bash scripts/verify-github-environments.sh container-publish

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            bulb-orbit/v2/package-lock.json
            electron/package-lock.json

      - name: Run shared preflight
        env:
          RUN_ORBIT_E2E: '1'
        run: bash scripts/preflight.sh

  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    environment: container-publish

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ needs.verify.outputs.tag_commit }}

      - name: Resolve tag & write VERSION
        id: version
        env:
          RESOLVED_TAG: ${{ needs.verify.outputs.tag }}
          VERIFIED_COMMIT: ${{ needs.verify.outputs.tag_commit }}
        run: |
          TAG="$RESOLVED_TAG"
          if [[ "$(git rev-parse HEAD)" != "$VERIFIED_COMMIT" ]]; then
            echo "::error::Build checkout does not match the verified tag commit"
            exit 1
          fi
          printf 'TAG=%s\n' "$TAG" >> "$GITHUB_ENV"
          printf '%s\n' "$TAG" > VERSION
          echo "Building validated tag for ${{ matrix.arch }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: calciumion/new-api

      - name: Build & push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            calciumion/new-api:${{ needs.verify.outputs.staging_prefix }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image with cosign
        run: cosign sign --yes calciumion/new-api@${{ steps.build.outputs.digest }}

      - name: Image summary
        run: |
          echo "### Docker Image Digest (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "calciumion/new-api:${{ needs.verify.outputs.staging_prefix }}-${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  create_manifests:
    name: Create multi-arch manifests
    needs: [verify, build_single_arch]
    runs-on: ubuntu-latest
    environment: container-publish
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set version
        env:
          RESOLVED_TAG: ${{ needs.verify.outputs.tag }}
          STAGING_PREFIX: ${{ needs.verify.outputs.staging_prefix }}
        run: |
          if [[ ! "$RESOLVED_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Resolved tag is invalid"
            exit 1
          fi
          printf 'TAG=%s\n' "$RESOLVED_TAG" >> "$GITHUB_ENV"
          printf 'STAGING_PREFIX=%s\n' "$STAGING_PREFIX" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & push manifest (version)
        run: |
          docker buildx imagetools create \
            --metadata-file manifest-version.json \
            -t calciumion/new-api:${TAG} \
            calciumion/new-api:${STAGING_PREFIX}-amd64 \
            calciumion/new-api:${STAGING_PREFIX}-arm64
          DIGEST=$(jq -r '.["containerimage.descriptor"].digest // empty' manifest-version.json)
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Versioned manifest did not return a valid digest"
            exit 1
          fi
          printf 'MANIFEST_DIGEST=%s\n' "$DIGEST" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign versioned multi-arch manifest
        run: cosign sign --yes calciumion/new-api@${MANIFEST_DIGEST}

      - name: Create & push manifest (latest)
        if: needs.verify.outputs.is_stable == 'true'
        run: |
          docker buildx imagetools create \
            -t calciumion/new-api:latest \
            calciumion/new-api@${MANIFEST_DIGEST}

      - name: Manifest summary
        run: |
          echo "### Multi-arch Manifest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect calciumion/new-api:${TAG} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
