name: Publish Docker image (alpha)

permissions:
  actions: read
  contents: read
  deployments: read

on:
  push:
    branches:
      - alpha
  workflow_dispatch:
    inputs:
      name:
        description: "reason"
        required: false

concurrency:
  group: publish-docker-alpha
  cancel-in-progress: false

jobs:
  verify:
    name: Verify alpha source before publishing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Check out alpha source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Validate source and determine alpha version
        id: version
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [ "$SOURCE_REF" != 'refs/heads/alpha' ]; then
            echo "::error::Alpha images may only be published from refs/heads/alpha"
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || {
            echo "::error::Checked-out commit does not match the workflow commit"
            exit 1
          }
          VERSION="alpha-$(git show -s --format=%cs | tr -d '-')-${GITHUB_SHA::12}"
          if [[ ! "$VERSION" =~ ^alpha-[0-9]{8}-[0-9a-f]{12}$ ]]; then
            echo "::error::Generated alpha version is invalid"
            exit 1
          fi
          printf 'value=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fail closed unless container publish Environment is protected
        env:
          GH_TOKEN: ${{ secrets.ENVIRONMENT_AUDIT_TOKEN || github.token }}
          GITHUB_ENVIRONMENT_APPROVALS_REQUIRED: 'false'
        run: bash scripts/verify-github-environments.sh container-publish

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: |
            bulb-orbit/v2/package-lock.json
            electron/package-lock.json

      - name: Run shared preflight
        env:
          RUN_ORBIT_E2E: '1'
        run: bash scripts/preflight.sh

  build_single_arch:
    name: Build & push (${{ matrix.arch }}) [native]
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    environment: container-publish
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - name: Check out (shallow)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Determine alpha version
        id: version
        env:
          RESOLVED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          VERSION="$RESOLVED_VERSION"
          if [[ ! "$VERSION" =~ ^alpha-[0-9]{8}-[0-9a-f]{12}$ ]]; then
            echo "::error::Resolved alpha version is invalid"
            exit 1
          fi
          echo "$VERSION" > VERSION
          printf 'value=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
          printf 'VERSION=%s\n' "$VERSION" >> "$GITHUB_ENV"
          echo "Publishing version: $VERSION for ${{ matrix.arch }}"

      - name: Normalize GHCR repository
        run: echo "GHCR_REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            calciumion/new-api
            ghcr.io/${{ env.GHCR_REPOSITORY }}

      - name: Build & push single-arch (to both registries)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            calciumion/new-api:${{ steps.version.outputs.value }}-${{ matrix.arch }}
            ghcr.io/${{ env.GHCR_REPOSITORY }}:${{ steps.version.outputs.value }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign image with cosign
        run: |
          cosign sign --yes calciumion/new-api@${{ steps.build.outputs.digest }}
          cosign sign --yes ghcr.io/${{ env.GHCR_REPOSITORY }}@${{ steps.build.outputs.digest }}

      - name: Output digest
        run: |
          echo "### Docker Image Digest (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "calciumion/new-api:${VERSION}-${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${GHCR_REPOSITORY}:${VERSION}-${{ matrix.arch }}" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  create_manifests:
    name: Create multi-arch manifests (Docker Hub + GHCR)
    needs: [verify, build_single_arch]
    runs-on: ubuntu-latest
    environment: container-publish
    permissions:
      packages: write
      contents: read
      id-token: write
    steps:
      - name: Normalize GHCR repository
        run: echo "GHCR_REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set alpha version
        env:
          RESOLVED_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          if [[ ! "$RESOLVED_VERSION" =~ ^alpha-[0-9]{8}-[0-9a-f]{12}$ ]]; then
            echo "::error::Resolved alpha version is invalid"
            exit 1
          fi
          printf 'VERSION=%s\n' "$RESOLVED_VERSION" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create & push manifest (Docker Hub - versioned alpha)
        run: |
          docker buildx imagetools create \
            --metadata-file manifest-dockerhub.json \
            -t calciumion/new-api:${VERSION} \
            calciumion/new-api:${VERSION}-amd64 \
            calciumion/new-api:${VERSION}-arm64
          DIGEST=$(jq -r '.["containerimage.descriptor"].digest // empty' manifest-dockerhub.json)
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Docker Hub manifest did not return a valid digest"
            exit 1
          fi
          printf 'DOCKERHUB_MANIFEST_DIGEST=%s\n' "$DIGEST" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest (GHCR - versioned alpha)
        run: |
          docker buildx imagetools create \
            --metadata-file manifest-ghcr.json \
            -t ghcr.io/${GHCR_REPOSITORY}:${VERSION} \
            ghcr.io/${GHCR_REPOSITORY}:${VERSION}-amd64 \
            ghcr.io/${GHCR_REPOSITORY}:${VERSION}-arm64
          DIGEST=$(jq -r '.["containerimage.descriptor"].digest // empty' manifest-ghcr.json)
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::GHCR manifest did not return a valid digest"
            exit 1
          fi
          printf 'GHCR_MANIFEST_DIGEST=%s\n' "$DIGEST" >> "$GITHUB_ENV"

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign versioned multi-arch manifests
        run: |
          cosign sign --yes calciumion/new-api@${DOCKERHUB_MANIFEST_DIGEST}
          cosign sign --yes ghcr.io/${GHCR_REPOSITORY}@${GHCR_MANIFEST_DIGEST}

      - name: Update signed alpha aliases
        run: |
          docker buildx imagetools create \
            -t calciumion/new-api:alpha \
            calciumion/new-api@${DOCKERHUB_MANIFEST_DIGEST}
          docker buildx imagetools create \
            -t ghcr.io/${GHCR_REPOSITORY}:alpha \
            ghcr.io/${GHCR_REPOSITORY}@${GHCR_MANIFEST_DIGEST}

      - name: Output manifest digest
        run: |
          echo "### Multi-arch Manifest Digests" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect calciumion/new-api:alpha >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect ghcr.io/${GHCR_REPOSITORY}:alpha >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
