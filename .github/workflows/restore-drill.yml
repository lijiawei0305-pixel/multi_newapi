name: Disposable Paired Restore Drill

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: restore-drill-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  paired-restore:
    name: Real MySQL + Redis backup / destroy / restore
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Run authoritative disposable restore drill
        env:
          REQUIRE_DOCKER: '1'
        run: bash deploy/ops/tests/restore-integration.sh
